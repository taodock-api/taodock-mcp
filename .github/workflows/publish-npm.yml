name: Publish npm

on:
  workflow_dispatch:
    inputs:
      dry_run:
        description: Build and pack without publishing
        type: boolean
        default: true
  push:
    tags:
      - "v*.*.*"

permissions:
  contents: read
  id-token: write

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      # Trusted Publishing requires npm CLI >= 11.5.1 and Node >= 22.14.0.
      # Keep release builds tokenless so an npm credential cannot shadow OIDC.
      - uses: actions/setup-node@v4
        with:
          node-version: "22.14.0"
          package-manager-cache: false
      - name: Upgrade npm for OIDC support
        run: npm install -g npm@^11.5.1 && npm --version
      - name: Ensure no registry credential is configured
        run: |
          npm config delete //registry.npmjs.org/:_authToken || true
          npm config delete //registry.npmjs.org/:_auth || true
          if [ -n "$NODE_AUTH_TOKEN" ]; then echo "NODE_AUTH_TOKEN must not be set for OIDC publishing" >&2; exit 1; fi
      - run: npm ci
      - run: npm run typecheck
      - run: npm test
      - run: npm run build
      - name: Verify release tag
        if: startsWith(github.ref, 'refs/tags/')
        run: |
          VERSION=$(node -p "require('./package.json').version")
          test "${GITHUB_REF_NAME}" = "v${VERSION}"
      - run: npm pack --dry-run
      - name: Publish with provenance
        if: github.event_name == 'push' || inputs.dry_run == false
        run: npm publish --access public --provenance
